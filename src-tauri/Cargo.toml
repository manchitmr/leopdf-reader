[package]
name = "leopdf"
version = "0.1.0"
description = "LeoPDF Reader — PDF reader with first-class Sinhala and Tamil support"
authors = ["LeoPDF contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/manchitmr/leopdf-reader"
edition = "2024"
rust-version = "1.90"

[lib]
name = "leopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0" }
tauri-plugin-dialog = "2"
